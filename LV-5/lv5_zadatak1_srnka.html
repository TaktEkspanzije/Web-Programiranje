
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Zadatak 1 - JSON</title>
</head>
<body>

    <h1>JSON</h1>

    <p id="ispis"></p>

    <script>
        const student = {
            ime: "Matej",
            prezime: "Srnka",
            godinaStudija: "3",
            godinaRodenja: 2004,
            smjer: "Informatika"
        };

        
        const mojJSON = JSON.stringify(student);

        
        document.getElementById("ispis").textContent = mojJSON;

        
        console.log(typeof mojJSON);

       
        const kopija = JSON.parse(mojJSON);

        console.log("Kopija objekta:", kopija);

    
        kopija.ime = "Marko";

     
        console.log("Izvorni objekt:", student);
        console.log("Promijenjena kopija:", kopija);

    </script>

</body>
</html>
