
<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Razvrstaj boje</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
        }

        .spremnici {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .spremnik {
            width: 200px;
            height: 200px;
            border: 2px solid black;

            display: flex;
            flex-direction: column;
            align-items: top;
            justify-content: top;

            position: relative;
        }

        .spremnik h2 {
            margin: 0;
        }

        .kvadrati {
            display: flex;
            justify-content: center;
            gap: 80px;
        }

        .kvadrat {
            width: 100px;
            height: 100px;
            cursor: grab;
        }

        .crni {
            background-color: black;
        }

        .crveni {
            background-color: red;
        }

        .aktivan {
            background-color: lightgray;
        }

        #poruka {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }

    </style>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <!-- JavaScript -->
    <script src="zadatak5.js" defer></script>

</head>

<body>

    <header>
        <h1>Razvrstaj boje</h1>
    </header>

    <main>

        <div class="spremnici">

            <div id="spremnikCrni" class="spremnik">
                <h2>Crno</h2>
            </div>

            <div id="spremnikCrveni" class="spremnik">
                <h2>Crveno</h2>
            </div>

        </div>

        <div class="kvadrati">

            <div id="kvadratCrni" class="kvadrat crni"></div>

            <div id="kvadratCrveni" class="kvadrat crveni"></div>

        </div>

        <p id="poruka"></p>

    </main>

</body>
</html>
